[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kev-ranker"
version = "1.0.0"
description = "Offline Docker inference and supervised fine-tuning for Kev"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.121.3", "uvicorn==0.38.0", "httpx==0.28.1",
  "python-multipart==0.0.20", "pydantic==2.12.4",
]

[project.optional-dependencies]
test = ["pytest==9.0.1", "pytest-asyncio==1.3.0", "ruff==0.14.6"]

[tool.setuptools.packages.find]
include = ["kev_service*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

